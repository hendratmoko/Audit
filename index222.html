<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temuan — Sistem Audit Internal SMK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell" id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header">
        <div><h1>⚠ Temuan &amp; Tindak Lanjut</h1><p>Dokumentasi temuan audit dan rencana perbaikan berkelanjutan</p></div>
        <button class="btn btn-primary" id="btnAddFinding">+ Tambah Temuan</button>
    </div>

    <div class="glass-panel" style="display:flex;gap:4px;padding:6px;margin-bottom:20px;overflow-x:auto">
        <button class="btn btn-ghost tab-btn" data-tab="daftar">📋 Daftar Temuan</button>
        <button class="btn btn-ghost tab-btn" data-tab="tindaklanjut">📌 Tindak Lanjut</button>
    </div>

    <div class="tab-panel" id="tab-daftar">
        <div class="chip-filter" style="margin-bottom:14px">
            <div class="field"><input class="input" id="findingSearch" placeholder="Cari deskripsi temuan..."></div>
            <div class="field"><select class="input" id="findingFilterMajor"><option value="">Semua Jurusan</option></select></div>
            <div class="field"><select class="input" id="findingFilterArea"><option value="">Semua Bagian</option></select></div>
            <div class="field"><select class="input" id="findingFilterPriority"><option value="">Semua Prioritas</option><option>Rendah</option><option>Sedang</option><option>Tinggi</option><option>Kritis</option></select></div>
            <div class="field"><select class="input" id="findingFilterType"><option value="">Semua Jenis</option><option>Minor</option><option>Major</option><option>Observasi</option><option>Peluang Perbaikan</option></select></div>
            <button class="btn btn-secondary" id="btnResetFindingFilter">Reset Filter</button>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Jurusan</th><th>Bagian</th><th>Deskripsi</th><th>Jenis</th><th>Prioritas</th><th>PIC</th><th>Deadline</th><th>Status</th><th>Aksi</th></tr></thead>
                <tbody id="findingTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="tab-panel" id="tab-tindaklanjut" style="display:none">
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-label">Total Tindak Lanjut</div><div class="kpi-value" id="apTotal">0</div></div>
            <div class="kpi-card"><div class="kpi-label">Belum Selesai</div><div class="kpi-value" id="apBelum" style="color:var(--danger)">0</div></div>
            <div class="kpi-card"><div class="kpi-label">Dalam Proses</div><div class="kpi-value" id="apProses" style="color:var(--warning)">0</div></div>
            <div class="kpi-card"><div class="kpi-label">Selesai / Terlambat</div><div class="kpi-value"><span id="apSelesai" style="color:var(--success)">0</span> / <span id="apTelat" style="color:var(--danger)">0</span></div></div>
        </div>
        <div class="chip-filter" style="margin-bottom:14px">
            <div class="field"><select class="input" id="actionFilterStatus"><option value="">Semua Status</option><option>Belum</option><option>Dalam Proses</option><option>Selesai</option><option>Diverifikasi</option></select></div>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead><tr><th>Temuan</th><th>Tindakan</th><th>PIC</th><th>Deadline</th><th>Status</th><th>Aksi</th></tr></thead>
                <tbody id="actionTableBody"></tbody>
            </table>
        </div>
    </div>
</template>

<!-- Modal Temuan -->
<div class="modal-backdrop" id="findingModal">
    <div class="modal modal-lg">
        <div class="modal-header"><h3 id="findingModalTitle">Tambah Temuan</h3><button class="modal-close" onclick="document.getElementById('findingModal').classList.remove('show')">✕</button></div>
        <form id="findingForm">
            <div class="modal-body">
                <div class="grid-2">
                    <div class="field"><label>Jurusan</label><select class="input" id="findingMajor" required></select></div>
                    <div class="field"><label>Bagian</label><select class="input" id="findingArea" required></select></div>
                </div>
                <div class="grid-2">
                    <div class="field"><label>Jenis Temuan</label><select class="input" id="findingType"><option>Minor</option><option>Major</option><option>Observasi</option><option>Peluang Perbaikan</option></select></div>
                    <div class="field"><label>Prioritas</label><select class="input" id="findingPriority"><option>Rendah</option><option>Sedang</option><option>Tinggi</option><option>Kritis</option></select></div>
                </div>
                <div class="field"><label>Deskripsi Temuan</label><textarea class="input" id="findingDescription" required></textarea></div>
                <div class="field"><label>Bukti</label><input class="input" id="findingEvidence" placeholder="Link bukti terkait"></div>
                <div class="field"><label>Rekomendasi</label><textarea class="input" id="findingRecommendation"></textarea></div>
                <div class="grid-2">
                    <div class="field"><label>PIC</label><input class="input" id="findingPic"></div>
                    <div class="field"><label>Deadline</label><input type="date" class="input" id="findingDeadline"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('findingModal').classList.remove('show')">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan Temuan</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Tindak Lanjut -->
<div class="modal-backdrop" id="actionModal">
    <div class="modal">
        <div class="modal-header"><h3>Rencana Tindak Lanjut</h3><button class="modal-close" onclick="document.getElementById('actionModal').classList.remove('show')">✕</button></div>
        <form id="actionForm">
            <div class="modal-body">
                <p class="text-muted" style="font-size:12.5px">Temuan: <strong id="actionFindingText"></strong></p>
                <div class="field"><label>Tindakan</label><textarea class="input" id="actionText" required></textarea></div>
                <div class="grid-2">
                    <div class="field"><label>PIC</label><input class="input" id="actionPic"></div>
                    <div class="field"><label>Deadline</label><input type="date" class="input" id="actionDeadline"></div>
                </div>
                <div class="field"><label>Status</label><select class="input" id="actionStatus"><option>Belum</option><option>Dalam Proses</option><option>Selesai</option><option>Diverifikasi</option></select></div>
                <div class="field"><label>Catatan</label><textarea class="input" id="actionNotes"></textarea></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('actionModal').classList.remove('show')">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
        </form>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script src="js/finding.js"></script>
<script>
(async function init() {
    if (!Auth.guard()) return;
    Layout.render("temuan.html");
    App.initShell();
    document.getElementById("pageContent").appendChild(document.getElementById("pageTemplate").content.cloneNode(true));

    await FindingModule.loadAll();
    document.getElementById("findingFilterMajor").innerHTML += FindingModule.state.majors.map(m => `<option value="${m.id}">${Utils.escapeHtml(m.name)}</option>`).join("");
    document.getElementById("findingFilterArea").innerHTML += FindingModule.state.areas.map(a => `<option value="${a.id}">${Utils.escapeHtml(a.name)}</option>`).join("");

    function refreshFindings() {
        FindingModule.renderFindingTable({
            q: document.getElementById("findingSearch").value,
            major: document.getElementById("findingFilterMajor").value,
            area: document.getElementById("findingFilterArea").value,
            priority: document.getElementById("findingFilterPriority").value,
            type: document.getElementById("findingFilterType").value
        });
    }
    ["findingFilterMajor", "findingFilterArea", "findingFilterPriority", "findingFilterType"].forEach(id => document.getElementById(id).addEventListener("change", refreshFindings));
    document.getElementById("findingSearch").addEventListener("input", Utils.debounce(refreshFindings, 250));
    document.getElementById("btnResetFindingFilter").addEventListener("click", () => {
        ["findingSearch", "findingFilterMajor", "findingFilterArea", "findingFilterPriority", "findingFilterType"].forEach(id => document.getElementById(id).value = "");
        refreshFindings();
    });
    document.getElementById("btnAddFinding").addEventListener("click", () => FindingModule.openFindingForm());
    document.getElementById("findingForm").addEventListener("submit", FindingModule.submitFindingForm);
    document.getElementById("actionForm").addEventListener("submit", FindingModule.submitActionForm);
    refreshFindings();

    function refreshActionKpi() {
        const k = FindingModule.actionPlanKpis();
        document.getElementById("apTotal").textContent = k.total;
        document.getElementById("apBelum").textContent = k.belum;
        document.getElementById("apProses").textContent = k.proses;
        document.getElementById("apSelesai").textContent = k.selesai;
        document.getElementById("apTelat").textContent = k.telat;
    }
    document.getElementById("actionFilterStatus").addEventListener("change", (e) => {
        FindingModule.renderActionTable({ status: e.target.value });
    });
    FindingModule.renderActionTable();
    refreshActionKpi();

    function setTab(tab) {
        Utils.qsa(".tab-btn").forEach(b => b.classList.toggle("btn-primary", b.dataset.tab === tab));
        Utils.qsa(".tab-panel").forEach(p => p.style.display = p.id === "tab-" + tab ? "block" : "none");
    }
    Utils.qsa(".tab-btn").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.tab; setTab(b.dataset.tab); }));
    setTab((location.hash || "#daftar").slice(1));
})();
</script>
</body>
</html>
