<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan — Sistem Audit Internal SMK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-shell" id="appShell"></div>

<template id="pageTemplate">
    <div class="page-header">
        <div><h1>⚙ Pengaturan</h1><p>Kelola jurusan, bagian audit, pengguna, dan konfigurasi sistem</p></div>
    </div>

    <div class="glass-panel" style="display:flex;gap:4px;padding:6px;margin-bottom:20px;overflow-x:auto">
        <button class="btn btn-ghost tab-btn" data-tab="jurusan">🎓 Jurusan</button>
        <button class="btn btn-ghost tab-btn" data-tab="bagian">🧩 Bagian Audit</button>
        <button class="btn btn-ghost tab-btn" data-tab="pengguna">👤 Pengguna</button>
        <button class="btn btn-ghost tab-btn" data-tab="periode">📅 Periode Audit</button>
        <button class="btn btn-ghost tab-btn" data-tab="konfigurasi">🔧 Konfigurasi</button>
    </div>

    <!-- JURUSAN -->
    <div class="tab-panel" id="tab-jurusan">
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary" id="btnAddMajor">+ Tambah Jurusan</button></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Kode</th><th>Nama Jurusan</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="majorTableBody"></tbody></table></div>
    </div>

    <!-- BAGIAN -->
    <div class="tab-panel" id="tab-bagian" style="display:none">
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary" id="btnAddArea">+ Tambah Bagian Audit</button></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Kode</th><th>Nama Bagian</th><th>Kategori</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="areaTableBody"></tbody></table></div>
    </div>

    <!-- PENGGUNA -->
    <div class="tab-panel" id="tab-pengguna" style="display:none">
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary" id="btnAddUser">+ Tambah Pengguna</button></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Jurusan</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="userTableBody"></tbody></table></div>
    </div>

    <!-- PERIODE -->
    <div class="tab-panel" id="tab-periode" style="display:none">
        <div class="card session-picker-card">
            <h3 class="card-title">Tambah Periode Audit</h3>
            <form id="periodForm">
                <div class="field"><label>Nama Periode</label><input class="input" id="periodName" placeholder="Contoh: 2026/2027 Semester 1" required></div>
                <div class="field"><label>Jenis</label><select class="input" id="periodType"><option>Harian</option><option>Bulanan</option><option>Semester</option><option>Tahunan</option><option>Khusus</option></select></div>
                <button type="submit" class="btn btn-primary btn-block">Simpan Periode</button>
            </form>
        </div>
        <div class="table-wrap mt-16"><table class="data-table"><thead><tr><th>Nama Periode</th><th>Jenis</th></tr></thead><tbody id="periodTableBody"></tbody></table></div>
    </div>

    <!-- KONFIGURASI -->
    <div class="tab-panel" id="tab-konfigurasi" style="display:none">
        <div class="card">
            <h3 class="card-title">Konfigurasi Umum</h3>
            <p class="text-muted" style="font-size:13px">GAS_URL, nama aplikasi, dan nama sekolah dikonfigurasi langsung pada file <code>js/config.js</code> agar tidak dapat diubah sembarangan dari antarmuka (menghindari kesalahan konfigurasi tidak sengaja).</p>
            <table class="data-table" style="margin-top:10px">
                <tr><td>GAS_URL</td><td id="cfgGasUrl"></td></tr>
                <tr><td>Nama Sekolah</td><td id="cfgSchool"></td></tr>
                <tr><td>Versi Aplikasi</td><td id="cfgVersion"></td></tr>
            </table>
        </div>
        <div class="card mt-16">
            <h3 class="card-title">Skema Penilaian</h3>
            <table class="data-table" id="cfgScoreTable"></table>
        </div>
        <div class="card mt-16">
            <h3 class="card-title">Kategori Nilai</h3>
            <table class="data-table" id="cfgCategoryTable"></table>
        </div>
        <div class="card mt-16">
            <h3 class="card-title">🗄 Backup Data</h3>
            <p class="text-muted" style="font-size:13px">Seluruh data tersimpan pada Google Spreadsheet sekolah. Untuk backup: buka Spreadsheet → <strong>File &gt; Download</strong> (pilih Excel/CSV), atau gunakan <strong>File &gt; Make a copy</strong> secara berkala.</p>
        </div>
    </div>
</template>

<!-- Modal Jurusan -->
<div class="modal-backdrop" id="majorModal"><div class="modal"><div class="modal-header"><h3 id="majorModalTitle">Tambah Jurusan</h3><button class="modal-close" onclick="document.getElementById('majorModal').classList.remove('show')">✕</button></div>
<form id="majorForm"><div class="modal-body">
    <div class="field"><label>Kode</label><input class="input" id="majorCode" required></div>
    <div class="field"><label>Nama Jurusan</label><input class="input" id="majorName" required></div>
    <div class="field"><label>Status</label><select class="input" id="majorStatus"><option>Aktif</option><option>Nonaktif</option></select></div>
</div><div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="document.getElementById('majorModal').classList.remove('show')">Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div></form>
</div></div>

<!-- Modal Bagian -->
<div class="modal-backdrop" id="areaModal"><div class="modal"><div class="modal-header"><h3 id="areaModalTitle">Tambah Bagian Audit</h3><button class="modal-close" onclick="document.getElementById('areaModal').classList.remove('show')">✕</button></div>
<form id="areaForm"><div class="modal-body">
    <div class="field"><label>Kode</label><input class="input" id="areaCode" required></div>
    <div class="field"><label>Nama Bagian</label><input class="input" id="areaName" required></div>
    <div class="field"><label>Kategori</label><input class="input" id="areaCategory" placeholder="Contoh: Manajemen, Kurikulum, K3, dsb"></div>
    <div class="field"><label>Status</label><select class="input" id="areaStatus"><option>Aktif</option><option>Nonaktif</option></select></div>
</div><div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="document.getElementById('areaModal').classList.remove('show')">Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div></form>
</div></div>

<!-- Modal Pengguna -->
<div class="modal-backdrop" id="userModal"><div class="modal"><div class="modal-header"><h3 id="userModalTitle">Tambah Pengguna</h3><button class="modal-close" onclick="document.getElementById('userModal').classList.remove('show')">✕</button></div>
<form id="userForm"><div class="modal-body">
    <div class="field"><label>Username</label><input class="input" id="userUsername" required></div>
    <div class="field"><label>Nama Lengkap</label><input class="input" id="userName" required></div>
    <div class="field"><label>Kata Sandi <span id="userPassHint" class="text-muted" style="font-weight:400"></span></label><input class="input" type="password" id="userPassword" placeholder="Kosongkan jika tidak diubah"></div>
    <div class="grid-2">
        <div class="field"><label>Role</label><select class="input" id="userRole"><option>ADMIN</option><option>AUDITOR</option><option>PIMPINAN</option><option>OPERATOR</option><option>VIEWER</option></select></div>
        <div class="field"><label>Jurusan (opsional)</label><select class="input" id="userMajor"><option value="">-</option></select></div>
    </div>
    <div class="field"><label>Status</label><select class="input" id="userStatus"><option>Aktif</option><option>Nonaktif</option></select></div>
</div><div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="document.getElementById('userModal').classList.remove('show')">Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div></form>
</div></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
(async function init() {
    if (!Auth.guard(["ADMIN", "OPERATOR"])) return;
    Layout.render("pengaturan.html");
    App.initShell();
    document.getElementById("pageContent").appendChild(document.getElementById("pageTemplate").content.cloneNode(true));

    let majors = [], areas = [], users = [], periods = [];
    async function loadAll() {
        Utils.setLoading(true, "Memuat data pengaturan...");
        [majors, areas, users, periods] = await Promise.all([Api.getMajors(), Api.getAreas(), Api.getUsers(), Api.getPeriods()]);
        Utils.setLoading(false);
        renderMajors(); renderAreas(); renderUsers(); renderPeriods();
    }

    // ---- JURUSAN ----
    function renderMajors() {
        document.getElementById("majorTableBody").innerHTML = majors.map(m => `<tr>
            <td>${Utils.escapeHtml(m.code)}</td><td>${Utils.escapeHtml(m.name)}</td>
            <td><span class="badge ${m.status === 'Aktif' ? 'badge-success' : 'badge-muted'}">${Utils.escapeHtml(m.status)}</span></td>
            <td class="table-actions"><button class="btn-icon" onclick='openMajorModal(${JSON.stringify(m).replace(/'/g, "&#39;")})'>✏</button>
            <button class="btn-icon danger" onclick="deleteMajor('${m.id}')">🗑</button></td></tr>`).join("") || `<tr><td colspan="4" class="empty-row">Belum ada jurusan</td></tr>`;
    }
    window.openMajorModal = function (m = null) {
        const modal = document.getElementById("majorModal");
        modal.dataset.editId = m ? m.id : "";
        document.getElementById("majorForm").reset();
        document.getElementById("majorModalTitle").textContent = m ? "Edit Jurusan" : "Tambah Jurusan";
        if (m) { document.getElementById("majorCode").value = m.code; document.getElementById("majorName").value = m.name; document.getElementById("majorStatus").value = m.status; }
        modal.classList.add("show");
    };
    document.getElementById("btnAddMajor").addEventListener("click", () => openMajorModal());
    document.getElementById("majorForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const modal = document.getElementById("majorModal");
        await Api.saveMajor({ id: modal.dataset.editId || undefined, code: document.getElementById("majorCode").value.trim(), name: document.getElementById("majorName").value.trim(), status: document.getElementById("majorStatus").value });
        Utils.toast("Jurusan tersimpan", "success"); modal.classList.remove("show"); await loadAll();
    });
    window.deleteMajor = async function (id) {
        if (!Utils.confirmDialog("Hapus jurusan ini?")) return;
        await Api.deleteMajor(id); Utils.toast("Jurusan dihapus", "success"); await loadAll();
    };

    // ---- BAGIAN ----
    function renderAreas() {
        document.getElementById("areaTableBody").innerHTML = areas.map(a => `<tr>
            <td>${Utils.escapeHtml(a.code)}</td><td>${Utils.escapeHtml(a.name)}</td><td>${Utils.escapeHtml(a.category || "-")}</td>
            <td><span class="badge ${a.status === 'Aktif' ? 'badge-success' : 'badge-muted'}">${Utils.escapeHtml(a.status)}</span></td>
            <td class="table-actions"><button class="btn-icon" onclick='openAreaModal(${JSON.stringify(a).replace(/'/g, "&#39;")})'>✏</button>
            <button class="btn-icon danger" onclick="deleteArea('${a.id}')">🗑</button></td></tr>`).join("") || `<tr><td colspan="5" class="empty-row">Belum ada bagian audit</td></tr>`;
    }
    window.openAreaModal = function (a = null) {
        const modal = document.getElementById("areaModal");
        modal.dataset.editId = a ? a.id : "";
        document.getElementById("areaForm").reset();
        document.getElementById("areaModalTitle").textContent = a ? "Edit Bagian Audit" : "Tambah Bagian Audit";
        if (a) { document.getElementById("areaCode").value = a.code; document.getElementById("areaName").value = a.name; document.getElementById("areaCategory").value = a.category || ""; document.getElementById("areaStatus").value = a.status; }
        modal.classList.add("show");
    };
    document.getElementById("btnAddArea").addEventListener("click", () => openAreaModal());
    document.getElementById("areaForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const modal = document.getElementById("areaModal");
        await Api.saveArea({ id: modal.dataset.editId || undefined, code: document.getElementById("areaCode").value.trim(), name: document.getElementById("areaName").value.trim(), category: document.getElementById("areaCategory").value.trim(), status: document.getElementById("areaStatus").value });
        Utils.toast("Bagian audit tersimpan", "success"); modal.classList.remove("show"); await loadAll();
    });
    window.deleteArea = async function (id) {
        if (!Utils.confirmDialog("Hapus bagian audit ini?")) return;
        await Api.deleteArea(id); Utils.toast("Bagian audit dihapus", "success"); await loadAll();
    };

    // ---- PENGGUNA ----
    function renderUsers() {
        document.getElementById("userTableBody").innerHTML = users.map(u => `<tr>
            <td>${Utils.escapeHtml(u.username)}</td><td>${Utils.escapeHtml(u.name)}</td><td><span class="badge badge-info">${Utils.escapeHtml(u.role)}</span></td>
            <td>${Utils.escapeHtml(majors.find(m => m.id === u.major_id)?.name || "-")}</td>
            <td><span class="badge ${u.status === 'Aktif' ? 'badge-success' : 'badge-muted'}">${Utils.escapeHtml(u.status || 'Aktif')}</span></td>
            <td class="table-actions"><button class="btn-icon" onclick='openUserModal(${JSON.stringify(u).replace(/'/g, "&#39;")})'>✏</button>
            <button class="btn-icon danger" onclick="deleteUser('${u.id}')">🗑</button></td></tr>`).join("") || `<tr><td colspan="6" class="empty-row">Belum ada pengguna</td></tr>`;
    }
    window.openUserModal = function (u = null) {
        const modal = document.getElementById("userModal");
        modal.dataset.editId = u ? u.id : "";
        document.getElementById("userForm").reset();
        document.getElementById("userModalTitle").textContent = u ? "Edit Pengguna" : "Tambah Pengguna";
        document.getElementById("userPassHint").textContent = u ? "(kosongkan jika tidak diubah)" : "";
        document.getElementById("userMajor").innerHTML = `<option value="">-</option>` + majors.map(m => `<option value="${m.id}">${Utils.escapeHtml(m.name)}</option>`).join("");
        if (u) {
            document.getElementById("userUsername").value = u.username; document.getElementById("userName").value = u.name;
            document.getElementById("userRole").value = u.role; document.getElementById("userMajor").value = u.major_id || "";
            document.getElementById("userStatus").value = u.status || "Aktif";
        }
        modal.classList.add("show");
    };
    document.getElementById("btnAddUser").addEventListener("click", () => openUserModal());
    document.getElementById("userForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const modal = document.getElementById("userModal");
        const payload = {
            id: modal.dataset.editId || undefined,
            username: document.getElementById("userUsername").value.trim(),
            name: document.getElementById("userName").value.trim(),
            role: document.getElementById("userRole").value,
            major_id: document.getElementById("userMajor").value,
            status: document.getElementById("userStatus").value
        };
        const pass = document.getElementById("userPassword").value;
        if (pass) payload.password = pass;
        else if (!modal.dataset.editId) { Utils.toast("Kata sandi wajib diisi untuk pengguna baru", "warning"); return; }
        await Api.saveUser(payload);
        Utils.toast("Pengguna tersimpan", "success"); modal.classList.remove("show"); await loadAll();
    });
    window.deleteUser = async function (id) {
        if (!Utils.confirmDialog("Hapus pengguna ini?")) return;
        await Api.deleteUser(id); Utils.toast("Pengguna dihapus", "success"); await loadAll();
    };

    // ---- PERIODE ----
    function renderPeriods() {
        document.getElementById("periodTableBody").innerHTML = periods.map(p => `<tr><td>${Utils.escapeHtml(p.name)}</td><td>${Utils.escapeHtml(p.type || "-")}</td></tr>`).join("") || `<tr><td colspan="2" class="empty-row">Belum ada periode</td></tr>`;
    }
    document.getElementById("periodForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        await Api.savePeriod({ name: document.getElementById("periodName").value.trim(), type: document.getElementById("periodType").value });
        Utils.toast("Periode audit ditambahkan", "success");
        document.getElementById("periodForm").reset();
        await loadAll();
    });

    // ---- KONFIGURASI ----
    document.getElementById("cfgGasUrl").textContent = CONFIG.GAS_URL;
    document.getElementById("cfgSchool").textContent = CONFIG.SCHOOL_NAME;
    document.getElementById("cfgVersion").textContent = CONFIG.VERSION;
    document.getElementById("cfgScoreTable").innerHTML = Object.entries(CONFIG.SCORE_MAP).map(([k, v]) => `<tr><td>${k}</td><td>${v === null ? "Tidak dihitung" : v + "%"}</td></tr>`).join("");
    document.getElementById("cfgCategoryTable").innerHTML = CONFIG.SCORE_CATEGORY.map(c => `<tr><td>${c.min}–${c.max}</td><td style="color:${c.color};font-weight:700">${c.label}</td></tr>`).join("");

    function setTab(tab) {
        Utils.qsa(".tab-btn").forEach(b => b.classList.toggle("btn-primary", b.dataset.tab === tab));
        Utils.qsa(".tab-panel").forEach(p => p.style.display = p.id === "tab-" + tab ? "block" : "none");
    }
    Utils.qsa(".tab-btn").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.tab; setTab(b.dataset.tab); }));
    setTab((location.hash || "#jurusan").slice(1));

    await loadAll();
})();
</script>
</body>
</html>
